name: Generate Snake

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: chelslava
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Create index page
        run: |
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Snake</title>
          </head>
          <body style="margin:0;background:#0d1117;display:flex;align-items:center;justify-content:center;min-height:100vh;">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="./github-snake-dark.svg" />
              <source media="(prefers-color-scheme: light)" srcset="./github-snake.svg" />
              <img src="./github-snake-dark.svg" alt="GitHub contribution snake" />
            </picture>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
